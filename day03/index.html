<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <div class="image">
      <span class="badge">New</span>
      <span class="emoji">👟</span>
    </div>

    <div class="info">
      <p class="category">Footwear</p>
      <h2>Classic Sneakers</h2>
      <p class="rating">★★★★☆ <span>(120 reviews)</span></p>
      <p class="description">Light, comfortable and made for everyday wear.</p>

      <div class="bottom">
        <span class="price">₦25,000</span>
        <button>Buy now</button>
      </div>
    </div>
  </div>

</body>
</html>
