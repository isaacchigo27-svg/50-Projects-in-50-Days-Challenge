<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pricing</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Choose Your Plan</h1>
  <p class="sub">Simple pricing, no hidden fees.</p>

  <div class="plans">

    <div class="card">
      <h2>Basic</h2>
      <p class="price">₦5,000<span>/month</span></p>
      <ul>
        <li>1 project</li>
        <li>Basic support</li>
        <li>1 GB storage</li>
      </ul>
      <button>Get started</button>
    </div>

    <div class="card popular">
      <p class="tag">Most popular</p>
      <h2>Standard</h2>
      <p class="price">₦10,000<span>/month</span></p>
      <ul>
        <li>10 projects</li>
        <li>Priority support</li>
        <li>10 GB storage</li>
      </ul>
      <button>Get started</button>
    </div>

    <div class="card">
      <h2>Premium</h2>
      <p class="price">₦20,000<span>/month</span></p>
      <ul>
        <li>Unlimited projects</li>
        <li>24/7 support</li>
        <li>100 GB storage</li>
      </ul>
      <button>Get started</button>
    </div>

  </div>

</body>
</html>
